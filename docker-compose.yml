services:
  db:
    image: postgres:16-alpine
    container_name: hospiflow-db
    environment:
      POSTGRES_DB: hospiflow
      POSTGRES_USER: hospiflow
      POSTGRES_PASSWORD: hospiflow_dev
    ports:
      - "5432:5432"
    volumes:
      - hospiflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospiflow -d hospiflow"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  hospiflow-db:
